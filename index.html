<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プライベート動画ギャラリー</title>
  <!-- ▼ キャッシュ対策用 ?v=4 -->
  <link rel="stylesheet" href="style.css?v=14">
    
  <!-- ▼ ホーム画面に追加したときのアイコン画像 -->

</head>
<body>

  <h1>🎀超特急動画ギャラリー 🎀</h1>

  <!-- ===================================================
       👑 1. イチオシ動画セクション
  =================================================== -->
  <div class="pickup-section">
    <div class="section-title">💖 PICK UP！りこが一番見てほしい動画</div>
    <div class="pickup-card">
      <div class="thumb-wrapper">
        <img src="IMG_5294.jpeg" alt="イチオシ" class="video-thumb">
        <span class="badge-new">MUST WATCH</span>
        <span class="badge-time">03:48</span>
      </div>
      <div class="video-title">『超えてアバンチュール』from BULLET TRAIN ARENA TOUR 2025-2026「REAL?」 </div>
      <div class="video-desc">全員の変顔に注目！</div>
      
<!-- イチオシ動画のボタン（HTML直書き部分） -->

<!-- イチオシ動画のボタン -->

<button type="button" class="play-btn" onclick="openModal('TPhx_q0cjIo')">
  <span>▶</span> 今すぐ見る
</button>


    </div>
  </div>

  <!-- ===================================================
       🏷️ 2. ジャンル切り替えタブ
  =================================================== -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="filterCategory('all', this)">✨ すべて</button>
    <button class="tab-btn" onclick="filterCategory('power', this)">😆 元気出る</button>
    <button class="tab-btn" onclick="filterCategory('cool', this)">😎 かっこいい</button>
    <button class="tab-btn" onclick="filterCategory('good', this)">😘 好きな曲</button>
    <button class="tab-btn" onclick="filterCategory('shuffle', this)">🫨 シャッフル</button>
    <button class="tab-btn" onclick="filterCategory('koeaba', this)">🤩 超えアバ</button>
  </div>


  <!-- ===================================================
       🎬 3. 動画一覧（2列グリッド）
  =================================================== -->
  <div class="video-grid" id="videoGrid"></div>


  <!-- ⚡ 4. データ読み込み＆モーダル処理 -->
  <script src="videos.js?v=6"></script>
  <script>
    const grid = document.getElementById('videoGrid');
    
    if (typeof videoData !== 'undefined' && grid) {
      videoData.forEach((video) => {
        const newBadge = video.isNew ? '<span class="badge-new">NEW!</span>' : '';
        const descText = video.desc ? `<div class="video-desc">${video.desc}</div>` : '';
        
        // 再生ボタンを押すとモーダルが開く設定
        const cardHtml = `
          <div class="video-card" data-category="${video.category}">
            <div class="thumb-wrapper">
              <img src="${video.thumb}" alt="サムネイル" class="video-thumb">
              ${newBadge}
              <span class="badge-time">${video.time}</span>
            </div>
            <div>
              <div class="video-title">${video.title}</div>
              ${descText}
            </div>
            <button type="button" class="play-btn" onclick="openModal('${video.youtubeId}')">
              <span>▶</span> 再生
            </button>
          </div>
        `;

        grid.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    // 🎬 モーダルを開いて動画を再生する関数
    function openModal(youtubeId) {
      const modal = document.getElementById('videoModal');
      const container = document.getElementById('modalPlayerContainer');
      
      if (modal && container && youtubeId) {
        // iPhone/Safari対策も含めたパラメータ（playsinline=1）
        container.innerHTML = `
          <iframe 
            src="https://www.youtube.com/embed/${youtubeId}?autoplay=1&playsinline=1&rel=0" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        `;
        modal.classList.add('active');
      }
    }

    // ❌ モーダルを閉じて動画（音）を止める関数
    function closeModal() {
      const modal = document.getElementById('videoModal');
      const container = document.getElementById('modalPlayerContainer');
      
      if (modal && container) {
        modal.classList.remove('active');
        container.innerHTML = ''; // プレイヤーを消して音を完全に止めます
      }
    }

    // 🏷️ タブ切り替え機能
    function filterCategory(category, btnElement) {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => tab.classList.remove('active'));

      if (btnElement) {
        btnElement.classList.add('active');
      }

      const cards = document.querySelectorAll('.video-card');
      cards.forEach(card => {
        const cardCategory = card.getAttribute('data-category');
        if (category === 'all' || cardCategory === category) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }
  </script>


  <!-- 🎬 ポップアップ（モーダル）プレイヤー本体 -->
  <div id="videoModal" class="video-modal">
    <div class="modal-content">
      <button type="button" class="modal-close" onclick="closeModal()">✕ 閉じる</button>
      <div class="modal-player-wrapper" id="modalPlayerContainer">
        <!-- ここにYouTubeプレイヤーが読み込まれます -->
      </div>
    </div>
  </div>



</body>
</html>
