<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プライベート動画ギャラリー</title>
  <style>
    /* ▼ ここはデザイン（色やレイアウト）の設定です */
    body {
      background-color: #ffffff !important; /* 背景色を強制的に「白」にする */
      color: #333333 !important;            /* 文字の色を「濃いグレー」にする */
      font-family: sans-serif;              /* 読みやすいフォントにする */
      padding: 20px;                        /* 画面の端に少し余白を作る */
      margin: 0;
    }
    .card {
      border: 1px solid #ccc;               /* 動画を入れる枠線を引く */
      border-radius: 8px;                   /* 枠線の角を丸くする */
      padding: 15px;                        /* 枠の中の余白 */
      margin-top: 20px;                     /* 上との間隔 */
      background-color: #f9f9f9;            /* 枠の中の背景色 */
    }
  </style>
</head>
<body>

  <!-- ▼ ここから下が画面に実際に表示される「文章や図」です -->
  <h1>🎬 プライベート動画ギャラリー</h1> <!-- 一番大きな見出し -->
  <p>サイトの作成に成功しました！</p> <!-- 普通の文章 -->

  <div class="card">
    <h3>サンプル動画エリア</h3>
    <p>ここにGoogleドライブの動画が入ります。</p>
  </div>

</body>
</html>
