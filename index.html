<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プライベート動画ギャラリー</title>
  <style>
    body {
      background-color: #f4f6f8 !important;
      color: #333333 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px 16px;
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin: 10px 0 24px 0;
      color: #1a1a1a;
      letter-spacing: 0.05em;
    }

    /* おしゃれなカードデザイン */
    .video-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      max-width: 500px;
      margin: 0 auto 16px auto;
      border: 1px solid #eaeaea;
    }

    /* サムネイル画像のスタイル */
    .video-thumb {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 12px;
      display: block;
      aspect-ratio: 16 / 9; /* 横長キレイに収める */
      object-fit: cover;
    }

    .video-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #222222;
      margin-bottom: 14px;
    }

    /* スマートな再生ボタン */
    .play-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 0;
      background: linear-gradient(135deg, #1a73e8, #0d52bf);
      color: #ffffff !important;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      border-radius: 10px;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3);
    }

    .play-btn span {
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <h1>🎬 プライベート動画ギャラリー</h1>

  <!-- 動画カード 1 -->
  <div class="video-card">
    <!-- ▼ アップロードした画像の名前をここに入れます（例: thumb1.jpg） -->
    <img src="photo-output.png" alt="サムネイル" class="video-thumb">
    
    <div class="video-title">『Believe×Believe』 from BULLET TRAIN ARENA TOUR 2025-2026 「REAL ?」</div>

    <a href="https://drive.google.com/file/d/1yhIwDsNCvOJ-k5aZzXlZeVM8qofwucTH/view" target="_blank" class="play-btn">
      <span>▶</span> 動画を再生する
    </a>
  </div>

</body>
</html>
