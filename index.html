<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プライベート動画ギャラリー</title>
  <style>
    body {
      background-color: #ffffff !important;
      color: #333333 !important;
      font-family: sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .video-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      background-color: #f9f9f9;
    }
    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 の画面比率 */
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>🎬 プライベート動画ギャラリー</h1>

  <div class="video-card">
    <h3>お気に入り動画</h3>
    <div class="video-container">
  
      <iframe src="https://drive.google.com/file/d/1yhIwDsNCvOJ-k5aZzXlZeVM8qofwucTH/preview"></iframe>
    </div>
  </div>

</body>
</html>
